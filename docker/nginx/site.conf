server {
    listen 80;
    server_name _;
    root /var/www/globaltool.vision-it.com.mx/public;
    index index.php;

    # Estáticos
    location ~* \.(jpg|jpeg|gif|png|svg|ico|css|js|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_read_timeout 300;
        internal;
    }

    # Seguridad mínima
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 64m;
    sendfile on;
}
