name: Deploy a global.vision-it.com.mx

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-global
  cancel-in-progress: false

env:
  APP_NAME: lta-global
  SSH_USER: deploy
  PHP_VERSION: '8.2'
  NODE_VERSION: '18'

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historia completa: el paso siguiente compara contra el commit anterior.
          fetch-depth: 0

      # Si este cambio toca migraciones, esperamos que `migrate` aplique algo.
      # Cuando no lo hace, el paso final de verificación falla el despliegue.
      - name: Detectar cambios en migraciones
        id: migrations
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "touched=unknown" >> $GITHUB_OUTPUT
            echo "Sin commit base — no se puede determinar si hubo cambios en migraciones."
          elif [ -n "$(git diff --name-only "$BASE" "${{ github.sha }}" -- database/migrations/)" ]; then
            echo "touched=true" >> $GITHUB_OUTPUT
            echo "Este cambio toca database/migrations/ — se verificará que se apliquen."
          else
            echo "touched=false" >> $GITHUB_OUTPUT
            echo "Sin cambios en database/migrations/."
          fi

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip, mysql, bcmath, intl, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer deps
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install npm deps
        run: npm install --no-audit --no-fund --no-progress

      - name: Build assets
        run: npm run prod

      - name: Build release tarball
        run: |
          RELEASE_NAME="${{ github.sha }}-$(date -u +%Y%m%d%H%M%S)"
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          tar --exclude='./.git' \
              --exclude='./node_modules' \
              --exclude='./tests' \
              --exclude='./.github' \
              --exclude='./storage' \
              --exclude='./.env*' \
              -czf "/tmp/${RELEASE_NAME}.tar.gz" .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload tarball
        run: |
          scp -i ~/.ssh/id_ed25519 \
            "/tmp/${RELEASE_NAME}.tar.gz" \
            "${SSH_USER}@${{ secrets.SSH_HOST }}:/tmp/"

      - name: Remote deploy
        run: |
          set -o pipefail
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${{ secrets.SSH_HOST }}" bash -s <<EOF | tee remote-output.log
          set -euo pipefail
          APP_DIR="/var/www/${APP_NAME}"
          SHARED="\$APP_DIR/shared"
          NEW_RELEASE="\$APP_DIR/releases/${RELEASE_NAME}"

          mkdir -p "\$NEW_RELEASE"
          tar -xzf "/tmp/${RELEASE_NAME}.tar.gz" -C "\$NEW_RELEASE"
          rm "/tmp/${RELEASE_NAME}.tar.gz"

          ln -sfn "\$SHARED/.env" "\$NEW_RELEASE/.env"
          rm -rf "\$NEW_RELEASE/storage"
          ln -sfn "\$SHARED/storage" "\$NEW_RELEASE/storage"

          cd "\$NEW_RELEASE"
          php artisan storage:link || true
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          ln -sfn "\$NEW_RELEASE" "\$APP_DIR/current"
          sudo systemctl reload php8.2-fpm

          # Mantener solo los últimos 3 releases
          cd "\$APP_DIR/releases"
          ls -1t | tail -n +4 | xargs -r rm -rf
          echo "OK: deployed ${RELEASE_NAME}"
          EOF

      # El código ya está publicado; lo que sigue solo decide el color del job.
      # Un cambio que toca migraciones y termina en "Nothing to migrate." dejó la
      # base sin actualizar: eso NO puede reportarse como éxito.
      - name: Verificar que las migraciones se aplicaron
        if: steps.migrations.outputs.touched == 'true'
        run: |
          set -euo pipefail

          if ! grep -q "Nothing to migrate" remote-output.log; then
            echo "OK — las migraciones se aplicaron."
            grep -E "Migrating:|Migrated:" remote-output.log || true
            exit 0
          fi

          echo "::error::El cambio toca migraciones pero artisan reportó 'Nothing to migrate.' — la base de datos NO se actualizó."
          echo ""
          echo "El código sí quedó publicado. Lo que no se aplicó son los datos."
          echo ""
          echo "Causa:"
          echo "  Laravel registra las migraciones ejecutadas por NOMBRE en la tabla \`migrations\`."
          echo "  Si se editó el up() de una migración ya ejecutada, su nombre sigue registrado"
          echo "  y artisan la omite — sin error, con el despliegue en verde."
          echo ""
          echo "Migraciones tocadas por este cambio:"
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- database/migrations/ | sed 's/^/  - /'
          echo ""
          echo "Cómo corregirlo:"
          echo "  Publicar la carga en una migración NUEVA (timestamp nuevo) e idempotente."
          echo "  Referencia: ADR-007 del framework."
          echo "  Ejemplo: database/migrations/2026_08_23_120000_reapply_august_2026_data_load.php"

          exit 1
